version: '3.8'

services:
  webhook-server:
    build: .
    container_name: simple-webhook-server
    restart: unless-stopped
    ports:
      - "3122:3122"
    environment:
      - PORT=3122
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - TARGET_BRANCH=${TARGET_BRANCH:-staging}
      - PROJECT_PATH=/var/www/fe-ielts-exams
    volumes:
      - ${PROJECT_PATH:-/var/www/fe-ielts-exams}:/var/www/fe-ielts-exams
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - webhook-network

networks:
  webhook-network:
    driver: bridge